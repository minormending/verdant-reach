<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Verdant Reach</title>
    <meta name="description" content="A Game Boy Color–style monster collector in which every creature is a real plant. Catalogue the QUICKENED, earn your Pressed Marks, and find out what woke them." />
    <meta name="theme-color" content="#0c1a12" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Verdant Reach" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Verdant Reach" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Verdant Reach" />
    <meta property="og:title" content="Verdant Reach" />
    <meta property="og:description" content="A GBC-style monster collector whose creatures are real plants. The Centuryheart has bloomed, and the valley is waking up." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Verdant Reach title screen: a pixel-art valley at dusk with a towering golden flower spike." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Verdant Reach" />
    <meta name="twitter:description" content="A GBC-style monster collector whose creatures are real plants." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <style>
      :root {
        --bg: #0c1a12;
        --bg-deep: #070f0a;
        --bezel: #1b2a21;
        --bezel-lit: #2a3d31;
        --bezel-shade: #101a14;
        --ink: #a8d098;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        /* A soft vignette and a faint dot-matrix weave: the "device" behind the screen. */
        background:
          radial-gradient(ellipse at 50% 42%, #14281c 0%, var(--bg) 55%, var(--bg-deep) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        color: var(--ink);
        font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(168, 208, 152, 0.05) 1px, transparent 1px);
        background-size: 6px 6px;
      }
      canvas#screen {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: var(--bg);
        display: block;
        z-index: 2;
        outline: none;
        touch-action: none;
      }
      /* The frame around the screen: darker than the page, lit from the top-left. */
      #vr-bezel {
        display: none;
        position: absolute;
        z-index: 1;
        background: linear-gradient(160deg, var(--bezel-lit) 0%, var(--bezel) 38%, var(--bezel-shade) 100%);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.55),
          inset 1px 1px 0 rgba(224, 240, 160, 0.08),
          inset -1px -1px 0 rgba(0, 0, 0, 0.35),
          0 18px 48px rgba(0, 0, 0, 0.55);
        pointer-events: none;
      }
      #vr-safe {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #vr-touch { display: none; position: fixed; inset: 0; z-index: 3; pointer-events: none; }
      .vr-ctl {
        position: absolute;
        pointer-events: auto;
        touch-action: none;
        cursor: pointer;
      }
      #vr-fs {
        position: fixed;
        z-index: 4;
        padding: 0;
        border: 0;
        background: transparent;
        opacity: 0.4;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      #vr-fs:hover, #vr-fs:focus-visible { opacity: 1; }
      #vr-fs:focus-visible { outline: 1px dashed var(--ink); outline-offset: 3px; }
      html[data-layout="portrait"] #vr-fs, html[data-layout="landscape"] #vr-fs { opacity: 0.55; }
      .vr-fallback-error {
        position: fixed;
        inset: auto 16px 24px 16px;
        z-index: 9;
        padding: 12px 16px;
        background: #f8f8f8;
        color: #181818;
        border: 3px solid #181818;
        border-radius: 4px;
        text-align: center;
      }
      noscript p { max-width: 32ch; text-align: center; }
    </style>
  </head>
  <body>
    <div id="vr-bezel"></div>
    <canvas id="screen" width="160" height="144" tabindex="-1" aria-label="Verdant Reach game screen"></canvas>
    <noscript><p>Verdant Reach needs JavaScript to grow. Please enable it and reload.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
